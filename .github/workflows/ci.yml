name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  # Bilinen açığı olan bağımlılık CI'ı kırar. İstisna (bilinçli, belgelenmiş):
  # - GHSA-g6cj-pr64-35w5 / PYSEC-2026-3552 (cryptography <50, pkcs7_decrypt_*): uygulama PKCS#7 çözmüyor;
  #   50.x arm64 Docker Desktop'ta "Illegal instruction" ile çöktüğü için 49.x'te kalındı (requirements.txt).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict --ignore-vuln GHSA-g6cj-pr64-35w5 --ignore-vuln PYSEC-2026-3552

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
