name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  # Bilinen açığı olan bağımlılık CI'ı kırar. İstisna (bilinçli, belgelenmiş):
  # - GHSA-g6cj-pr64-35w5 / PYSEC-2026-3552 (cryptography <50, pkcs7_decrypt_*): uygulama PKCS#7 çözmüyor;
  #   50.x arm64 Docker Desktop'ta "Illegal instruction" ile çöktüğü için 49.x'te kalındı (requirements.txt).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict --ignore-vuln GHSA-g6cj-pr64-35w5 --ignore-vuln PYSEC-2026-3552

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test   # biçim (C6) ve eşitlik kuralları (C7); Node'un kendi test koşucusu, .ts tipleri ayıklanarak
      - run: npm run build
